name: Release

# 阶段 1：把发布构建搬到 CI。本工作流目前只产出**未签名**产物并上传为 workflow artifact。
# 代码签名（SignPath）与自动建 release 分别在阶段 2 / 阶段 3 接进来，见项目记忆第 8 节。
#
# 注意：SignPath 的 signing policy 会把「Allowed build definitions」精确限定到本文件路径，
# 所以不要改这个文件名（.github/workflows/release.yml）。

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read   # 阶段 3 要由 CI 建 release 时改成 write

env:
  # 是否已接入 SignPath 签名。阶段 2 落地后改成 "true"：发布说明里的「签名状态」会随之切换
  SIGNING_ENABLED: "false"
  # runner 是 en-US 区域，Python 默认文件编码会是 cp1252；而我们的 spec / 版本资源里
  # 有中文，必须固定成 UTF-8，否则产物里的中文元数据会乱码
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build:
    name: 构建（Windows 未签名产物）
    runs-on: windows-latest
    outputs:
      version: ${{ steps.gate.outputs.version }}
    steps:
      - name: 检出（含全部历史与标签）
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # 版本号三处一致 + 发布标签必须在 main 上（项目记忆第 1、3 节的约定）
      - name: 门禁：版本号一致性 / 标签分支
        id: gate
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"

          $ver = (Select-String -Path "app\__init__.py" -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $iss = (Select-String -Path "bird_album.iss" -Pattern 'MyAppVersion\s+"([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "版本：app/__init__.py=$ver  bird_album.iss=$iss  触发=$env:REF_TYPE:$env:REF_NAME"

          if ($ver -ne $iss) {
            throw "版本号不一致：app/__init__.py=$ver，bird_album.iss=$iss（见项目记忆第 1 节）"
          }
          if ($env:REF_TYPE -eq "tag") {
            $tagVer = $env:REF_NAME -replace '^v', ''
            if ($tagVer -ne $ver) {
              throw "标签 $env:REF_NAME 与 __version__（$ver）不一致，拒绝构建"
            }
            git fetch origin main --quiet
            git merge-base --is-ancestor $env:REF_NAME origin/main
            if ($LASTEXITCODE -ne 0) {
              throw "标签 $env:REF_NAME 不在 main 上，拒绝构建"
            }
          }
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 安装 Python 与依赖
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: 安装 requirements.txt
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 构建主程序（PyInstaller onedir）
        run: python -m PyInstaller BirdAlbum.spec --noconfirm --clean

      # exe 的版本资源是代码签名（SignPath）元数据约束的前提，必须在这里挡住
      - name: 自检：版本资源 + 冻结 exe 可启动
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exe = Get-ChildItem -Path "dist" -Filter "*.exe" -File -Recurse -Depth 1 | Select-Object -First 1
          if (-not $exe) { throw "未找到 PyInstaller 产物 exe" }

          $vi = $exe.VersionInfo
          Write-Host "ProductName=$($vi.ProductName)  ProductVersion=$($vi.ProductVersion)  FileVersion=$($vi.FileVersion)  CompanyName=$($vi.CompanyName)"
          if ([string]::IsNullOrWhiteSpace($vi.ProductVersion)) {
            throw "exe 没有版本资源（代码签名的 artifact configuration 需要它）"
          }
          if ($vi.ProductVersion -ne $env:VERSION) {
            throw "exe 的 ProductVersion（$($vi.ProductVersion)）与 __version__（$env:VERSION）不一致"
          }

          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) {
            throw "冻结后的 exe 启动即退出（exit=$($p.ExitCode)）：PySide6 / Pillow / openpyxl 的隐藏导入可能不完整"
          }
          $p.Kill()
          Write-Host "offscreen 存活 10 秒：OK"

      - name: 编译安装包（Inno Setup）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $candidates = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "镜像里没有 Inno Setup，改用 choco 安装"
            choco install innosetup --no-progress -y
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "找不到 ISCC.exe（Inno Setup 6）" }
          Write-Host "使用 $iscc"

          & $iscc bird_album.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC 编译失败，退出码 $LASTEXITCODE" }

      # 发布资产名一律用 ASCII：GitHub 会清洗非 ASCII 资产名（项目记忆第 3.1 节）
      - name: 打免安装包 + 统一为 ASCII 资产名
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $setup = Get-ChildItem -Path "installer" -Filter "*_Setup_*.exe" | Select-Object -First 1
          if (-not $setup) { throw "未找到 Inno Setup 编译出的安装包" }
          Copy-Item $setup.FullName "installer\BirdAlbum_Setup_$($env:VERSION).exe" -Force

          $distFolder = Get-ChildItem -Path "dist" -Directory | Select-Object -First 1
          Compress-Archive -Path $distFolder.FullName -DestinationPath "installer\BirdAlbum_$($env:VERSION)_portable.zip" -Force

      # 合规红线：产物里绝不能出现 eBird 分类数据或其演绎产物（项目记忆第 1 节）
      - name: 门禁：产物不含 eBird 数据 / 数据库
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # 1) 构建产物（安装包只打包 dist + LICENSE，所以查这两处即可）
          $hits = Get-ChildItem -Path "dist", "installer" -File -Recurse -ErrorAction SilentlyContinue |
                  Where-Object { $_.Extension -in ".xlsx", ".xls", ".db" }

          # 2) 仓库本身：查**被跟踪**的文件（CI 是干净检出，本机未跟踪的下载文件不算数）
          $tracked = git ls-files | Where-Object { $_ -match '\.(xlsx|xls|db)$' }
          if ($tracked) {
            $tracked | ForEach-Object { Write-Host "tracked: $_" }
            throw "仓库里有被跟踪的 eBird 分类表 / 数据库文件，拒绝发布（合规红线）"
          }
          if ($hits.Count -gt 0) {
            $hits | ForEach-Object { Write-Host "artifact: $($_.FullName)" }
            throw "构建产物里出现 eBird 分类表 / 数据库文件，拒绝发布（合规红线）"
          }

          # 3) 第三方中文名补充包（CC BY-NC 4.0）必须随包，且协议与署名一并随包
          #    （PyInstaller 6 的 onedir 把 datas 放在 exe 同级的 _internal/ 下，故递归找）
          $bridge = @(
            Get-ChildItem -Path "dist" -Recurse -Directory -Filter "chinese-bird-name-bridge" |
            Select-Object -First 1
          )
          if ($bridge.Count -eq 0) {
            throw "随包数据缺失：dist 下找不到 third_party/chinese-bird-name-bridge"
          }
          foreach ($f in @("ioc-species-db.json", "LICENSE-DATA", "NOTICE.md")) {
            if (-not (Test-Path (Join-Path $bridge[0].FullName $f))) {
              throw "随包数据缺失：$($bridge[0].FullName)\$f（中文名补充包及其授权文件必须随包）"
            }
          }

          # 4) 上游 data/ 下的 ebird-*.json 是 eBird 数据的演绎，绝不能混进来
          $ebirdDerived = @(
            Get-ChildItem -Path "dist", "installer" -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like "ebird-*.json" }
          )
          if ($ebirdDerived.Count -gt 0) {
            $ebirdDerived | ForEach-Object { Write-Host "artifact: $($_.FullName)" }
            throw "构建产物里出现 eBird 演绎数据（ebird-*.json），拒绝发布（合规红线）"
          }
          Write-Host "合规检查通过：无 xlsx / db / ebird-*.json，补充包与授权文件已随包"

      - name: 输出产物清单与校验和（未签名）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $lines = @("## 未签名构建产物（阶段 1：CI 构建验证）", "", "| 文件 | 大小 | SHA-256 |", "| --- | --- | --- |")
          Get-ChildItem "installer\BirdAlbum_*" | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            $size = "{0:N2} MB" -f ($_.Length / 1MB)
            $lines += "| $($_.Name) | $size | $hash |"
            Write-Host "$($_.Name)  $size  $hash"
          }
          $lines += ""
          $lines += "> 这是**未签名**的 CI 构建产物，仅用于验证流水线；签名后的发布资产在阶段 2/3 接入后另行生成。"
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: 上传产物（未签名）
        uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned
          if-no-files-found: error
          retention-days: 14
          path: |
            installer/BirdAlbum_Setup_*.exe
            installer/BirdAlbum_*_portable.zip

  # 阶段 3（不依赖签名的部分）：由 CI 建发布页 —— 渲染发布说明、算校验和、上传资产。
  # 只在推送 v* 标签时执行；手动触发只跑构建，不会发版。
  # 签名接入后（阶段 2），本 job 里加一步替换资产即可，其余流程不变。
  release:
    name: 建发布页
    needs: build
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    permissions:
      contents: write   # 建 release / 上传资产
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: 检出（取发布说明）
        uses: actions/checkout@v7

      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          name: windows-unsigned
          path: dist-assets

      # 发布说明写在 docs/release-notes/<tag>.md（从 TEMPLATE.md 复制），占位符由这里替换。
      # 校验和只能算签名后的文件，所以这一步必须在签名之后（见项目记忆 8.3）。
      - name: 渲染发布说明
        id: notes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $src = "docs/release-notes/$env:TAG.md"
          if (-not (Test-Path $src)) {
            throw "缺少 $src：请从 docs/release-notes/TEMPLATE.md 复制一份并填写（见项目记忆第 3 节）"
          }

          $setup = Get-ChildItem "dist-assets" -Filter "BirdAlbum_Setup_*.exe" | Select-Object -First 1
          $portable = Get-ChildItem "dist-assets" -Filter "BirdAlbum_*_portable.zip" | Select-Object -First 1
          if (-not $setup -or -not $portable) { throw "下载到的产物不完整" }

          $signing = if ($env:SIGNING_ENABLED -eq "true") {
            "安装包与免安装包**已由 SignPath Foundation 签名**；若仍出现 SmartScreen 提示，属新版本信誉累积期，正常现象"
          } else {
            "本版**未做代码签名**，Windows SmartScreen 可能提示「未知发布者」，选择「仍要运行」即可（签名链路接入中）"
          }

          $map = [ordered]@{
            "{{VERSION}}"         = $env:VERSION
            "{{SIZE_SETUP}}"      = "{0:N1} MB" -f ($setup.Length / 1MB)
            "{{SIZE_PORTABLE}}"   = "{0:N1} MB" -f ($portable.Length / 1MB)
            "{{SHA256_SETUP}}"    = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash
            "{{SHA256_PORTABLE}}" = (Get-FileHash $portable.FullName -Algorithm SHA256).Hash
            "{{SIGNING_STATUS}}"  = $signing
          }

          $text = Get-Content $src -Raw -Encoding utf8
          $text = [regex]::Replace($text, "(?s)<!--.*?-->", "")   # 去掉模板自带的用法注释
          foreach ($k in $map.Keys) { $text = $text.Replace($k, $map[$k]) }

          $left = [regex]::Matches($text, "\{\{[A-Z_]+\}\}") | ForEach-Object { $_.Value } | Select-Object -Unique
          if ($left) { throw "发布说明里还有未替换的占位符：$($left -join '、')" }

          # 写到 dist-assets 之外，免得被当成发布资产上传
          Set-Content -Path "release-notes.md" -Value $text -Encoding utf8 -NoNewline
          Write-Host "发布说明已渲染：release-notes.md"

      - name: 生成 SHA256SUMS.txt
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $lines = Get-ChildItem "dist-assets" -File |
                   Where-Object { $_.Extension -in ".exe", ".zip" } |
                   Sort-Object Name |
                   ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $_.Name }
          Set-Content -Path "dist-assets\SHA256SUMS.txt" -Value $lines -Encoding utf8
          Get-Content "dist-assets\SHA256SUMS.txt"

      - name: 创建 / 更新发布页
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $assets = @(Get-ChildItem "dist-assets" -File | Select-Object -ExpandProperty FullName)
          $title = "鸟类相册 $env:TAG"

          # --verify-tag：复用本地推上来的签名标签，不允许 gh 另建轻量标签（项目记忆第 3 节）
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "发布页已存在：更新说明并覆盖资产（便于重跑）"
            gh release edit $env:TAG --title $title --notes-file "release-notes.md"
            if ($LASTEXITCODE -ne 0) { throw "更新发布说明失败" }
            gh release upload $env:TAG @assets --clobber
          } else {
            gh release create $env:TAG --verify-tag --title $title --notes-file "release-notes.md" @assets
          }
          if ($LASTEXITCODE -ne 0) { throw "创建发布页失败" }

          $url = gh release view $env:TAG --json url -q .url
          Write-Host "发布页：$url"
          "### 发布页`n`n$url" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
